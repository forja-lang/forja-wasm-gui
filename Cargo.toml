[package]
name = "forja-wasm-gui"
version = "0.9.4"
edition = "2021"
description = "Forja WASM GUI Runtime — renderiza interfaces Forja en un <canvas> HTML5"
authors = ["forja-lang"]
license = "GPL-3.0-or-later"
repository = "https://github.com/forja-lang/forja"
homepage = "https://github.com/forja-lang/forja"
documentation = "https://docs.rs/forja-wasm-gui"
readme = "README.md"
keywords = ["forja", "wasm", "gui", "canvas"]
categories = ["wasm", "gui"]

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "TextMetrics",
    "MouseEvent",
    "KeyboardEvent",
    "EventListener",
    "Window",
    "HtmlInputElement",
] }
forja = { path = "../.." }
serde_json = "1"

[features]
default = []

[package.metadata]
# F2-T2: habilitar wasm-opt para reducir el tamaño del binario.
# Los flags habilitan las features modernas de wasm que genera LLVM
# (bulk-memory, nontrapping-float-to-int, sign-ext).
wasm-opt = ["--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "-O3"]
